services:
  web:
    image: ${IMAGE_WEB}:${TAG}
    restart: unless-stopped
    volumes:
      - laravel-storage-production:/var/www/storage:ro
      - laravel-public-assets:/var/www/public/build:ro
    networks:
      - laravel-production
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    image: ${IMAGE_PHP}:${TAG}
    restart: unless-stopped
    volumes:
      - laravel-public-assets:/var/www/public/build
      - laravel-storage-production:/var/www/storage
    env_file:
      - .env
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Riga
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
    volumes:
      - mysql-data-production:/var/lib/mysql
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue:
    image: ${IMAGE_PHP}:${TAG}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - laravel-production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90" ]
    volumes:
      - laravel-storage-production:/var/www/storage

  scheduler:
    image: ${IMAGE_PHP}:${TAG}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - laravel-production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "php", "artisan", "schedule:work" ]
    volumes:
      - laravel-storage-production:/var/www/storage

networks:
  laravel-production:

volumes:
  mysql-data-production:
  laravel-storage-production:
  laravel-public-assets:
