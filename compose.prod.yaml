services:
  php-fpm:
    image: ghcr.io/${OWNER}/${IMAGE_PREFIX}-php-fpm:${TAG}
    container_name: php-fpm
    env_file:
      - .env.prod
    volumes:
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel_prod
    restart: unless-stopped

  nginx:
    image: ghcr.io/${OWNER}/${IMAGE_PREFIX}-nginx:${TAG}
    container_name: nginx
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - php-fpm
    networks:
      - laravel_prod
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env.prod
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel_prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - laravel_prod
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  storage-data:
  cache-data:

networks:
  laravel_prod:
    driver: bridge
