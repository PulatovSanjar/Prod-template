services:
  web:
    image: ${IMAGE_WEB:-nginx:1.27-alpine}
    build:
      context: .
      dockerfile: ./docker/development/nginx/Dockerfile
    volumes:
      - ./:/var/www
      - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    image: ${IMAGE_PHP:-local-php-fpm}
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  workspace:
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
    ports:
      - "${VITE_PORT:-5173}:5173"
    tty: true
    stdin_open: true
    env_file:
      - .env
    volumes:
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: service_magma
      MYSQL_USER: magma
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: superStrongRootPass
      TZ: Europe/Riga
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
    volumes:
      - mysql-data-development:/var/lib/mysql
    networks:
      - laravel-development

  redis:
    image: redis:7-alpine
    networks:
      - laravel-development

  queue:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www
    command: [ "php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90" ]
    networks:
      - laravel-development

  scheduler:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
    env_file:
      - .env
    networks:
      - laravel-development
    command: [ "php", "artisan", "schedule:work" ]
    volumes:
      - ./:/var/www

networks:
  laravel-development:

volumes:
  mysql-data-development:
