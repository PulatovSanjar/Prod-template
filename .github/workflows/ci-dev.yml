name: CI/CD (DEV)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ci-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: magma-bank-service
  TAG: ${{ github.sha }}

# =================================================
# 1️⃣ BUILD
# =================================================
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build php-fpm (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm:${{ env.TAG }}

      - name: Build php-fpm (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: development
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm-dev:${{ env.TAG }}

      - name: Build workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/development/workspace/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }}

      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/nginx/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-web:${{ env.TAG }}

  # =================================================
  # 2️⃣ TEST
  # =================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env & start services
        run: |
          cp .env.example .env
          docker compose -f compose.dev.yaml up -d mysql redis

      - name: Composer install
        run: |
          docker compose -f compose.dev.yaml run --rm workspace sh -c "
            git config --global --add safe.directory /var/www &&
            composer install --no-interaction --prefer-dist
          "

      - name: App key
        run: |
          docker compose -f compose.dev.yaml run --rm workspace \
            php artisan key:generate

      - name: PHP CS Fixer
        run: |
          docker compose -f compose.dev.yaml run --rm workspace \
            ./vendor/bin/php-cs-fixer fix --dry-run --allow-risky=yes

      - name: PHPUnit
        run: |
          docker compose -f compose.dev.yaml run --rm workspace \
            ./vendor/bin/phpunit

      - name: PHPStan
        run: |
          docker compose -f compose.dev.yaml run --rm workspace \
            ./vendor/bin/phpstan analyse --memory-limit=-1

  # =================================================
  # 3️⃣ MIGRATE (DEV)
  # =================================================
  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    needs: test
    environment: development

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Run migrations
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
            set -e
            cd ${{ secrets.DEV_DEPLOY_PATH }}
            echo TAG=${{ env.TAG }} > .env.deploy
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env.deploy -f compose.prod.yaml pull
            docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force
          "

  # =================================================
  # 4️⃣ DEPLOY (DEV)
  # =================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    environment: development

    steps:
      - name: Deploy
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
            set -e
            cd ${{ secrets.DEV_DEPLOY_PATH }}
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d --remove-orphans
          "
