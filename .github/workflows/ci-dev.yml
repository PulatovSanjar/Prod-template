name: CI/CD (DEV)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ci-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: magma-bank-service
  TAG: ${{ github.sha }}

jobs:
  # =================================================
  # 1️⃣ BUILD
  # =================================================
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # ---- php-fpm (prod runtime) ----
      - name: Build php-fpm (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm:${{ env.TAG }}

      # ---- php-fpm (dev runtime) ----
      - name: Build php-fpm (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: development
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm-dev:${{ env.TAG }}

      # ---- workspace (CLI) ----
      - name: Build workspace (CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/development/workspace/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }}

      # ---- nginx ----
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-web:${{ env.TAG }}

  # =================================================
  # 2️⃣ TEST (CLI = workspace)
  # =================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start DB
        run: docker compose -f compose.dev.yaml up -d mysql redis

      - name: Prepare env
        run: cp .env.example .env

      - name: Composer install
        run: |
          docker run --rm \
          -u "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "$PWD":/var/www \
          ghcr.io/spacefex/magma-bank-service-workspace:${{ github.sha }} \
          sh -c "
          git config --global --add safe.directory /var/www &&
          composer install --no-interaction --prefer-dist
          "
      - name: Prepare Laravel writable dirs
        run: |
          docker run --rm \
            -u 0:0 \
            -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            sh -c "
              mkdir -p storage/logs bootstrap/cache &&
              chown -R 1000:1000 storage bootstrap/cache .env &&
              chmod -R ug+rw storage bootstrap/cache .env
            "
      - name: App key
        run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            php artisan key:generate
      - name: PHP CS Fixer
        run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            ./vendor/bin/php-cs-fixer fix --dry-run --allow-risky=yes
      - name: PHPUnit
        run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            ./vendor/bin/phpunit
      - name: PHPStan
        run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            ./vendor/bin/phpstan analyse --memory-limit=-1

  # =================================================
  # 3️⃣ MIGRATE (DEV)
  # =================================================
  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    needs: test
    environment: development

    steps:
      - name: Debug secrets (safe)
        run: |
          if [ -z "${{ secrets.DEV_SSH_KEY }}" ]; then
            echo "DEV_SSH_KEY is EMPTY"
            exit 1
          else
            echo "DEV_SSH_KEY is PRESENT"
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
      - name: Run migrations
        run: |
          ssh -i "${{ secrets.DEV_SSH_KEY }}" \
            ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
              cd ${{ secrets.DEV_DEPLOY_PATH }} &&
              echo TAG=${{ env.TAG }} > .env.deploy &&
              docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} &&
              docker compose --env-file .env.deploy -f compose.prod.yaml pull &&
              docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force
            "

  # =================================================
  # 4️⃣ DEPLOY (DEV)
  # =================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: migrate
    environment: development

    steps:
      - name: Deploy
        run: |
          ssh -i "${{ secrets.DEV_SSH_KEY }}" \
            ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
              cd ${{ secrets.DEV_DEPLOY_PATH }} &&
              docker compose --env-file .env.deploy -f compose.prod.yaml up -d --remove-orphans
            "
