name: CI/CD (DEV)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: prod-template
  TAG: ${{ github.sha }}

jobs:
  # =========================================
  # 1️⃣ BUILD (PRODUCTION IMAGE)
  # =========================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build php-fpm (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE }}:${{ env.TAG }}

  # =========================================
  # 2️⃣ TEST (CI IMAGE)
  # =========================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: ci
          tags: app:ci
          load: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Start test environment
        run: |
          # Create network for inter-container communication
          docker network create laravel-test || true

          # Start CI container in background
          docker run -d \
            --name laravel-ci \
            --network laravel-test \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=testing \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=secret \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            --network host \
            app:ci \
            sleep infinity

      - name: Prepare Laravel
        run: |
          docker exec laravel-ci cp .env.example .env
          docker exec laravel-ci php artisan key:generate
          docker exec laravel-ci php artisan config:clear

      - name: Run PHPUnit tests
        run: |
          docker exec laravel-ci vendor/bin/phpunit --testdox --stop-on-failure

      - name: Cleanup
        if: always()
        run: |
          docker stop laravel-ci || true
          docker rm laravel-ci || true

    static-analysis:
      name: Static Analysis
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build CI image with cache
          uses: docker/build-push-action@v6
          with:
            context: .
            file: docker/common/php-fpm/Dockerfile
            target: ci
            tags: app:ci
            load: true
            cache-from: type=gha,scope=ci
            cache-to: type=gha,mode=max,scope=ci

        - name: Run PHPStan
          run: |
            docker run --rm \
              -v $(pwd):/var/www/html \
              -w /var/www/html \
              app:ci \
              vendor/bin/phpstan analyse --memory-limit=2G --no-progress

        - name: Run Laravel Pint
          if: always()
          run: |
            docker run --rm \
              -v $(pwd):/var/www/html \
              -w /var/www/html \
              app:ci \
              vendor/bin/pint --test || echo "Code style issues found"

  # =========================================
  # 3️⃣ MIGRATE
  # =========================================
  migrate:
    runs-on: ubuntu-latest
    needs: test
    environment: development

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Migrate DB
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
            cd ${{ secrets.DEV_DEPLOY_PATH }} &&
            echo TAG=${{ env.TAG }} > .env.deploy &&
            docker login ghcr.io -u ${{ github.actor }} -p '${{ secrets.GITHUB_TOKEN }}' &&
            docker compose --env-file .env.deploy -f compose.prod.yaml pull &&
            docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force
          "

  # =========================================
  # 4️⃣ DEPLOY
  # =========================================
  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment: development

    steps:
      - name: Deploy
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} "
            cd ${{ secrets.DEV_DEPLOY_PATH }} &&
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d --remove-orphans
          "
