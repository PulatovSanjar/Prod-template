name: CI Pipeline (Optimized)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  PHP_VERSION: '8.4'
  MYSQL_VERSION: '8.4'
  REDIS_VERSION: '7'

jobs:
  # ============================================
  # BUILD CI IMAGE (shared by other jobs)
  # ============================================
  build-ci:
    name: Build CI Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: ci
          tags: app:ci
          outputs: type=docker,dest=/tmp/app-ci.tar
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

      - name: Upload CI image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-image
          path: /tmp/app-ci.tar
          retention-days: 1

  # ============================================
  # UNIT TESTS
  # ============================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI image
        uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp

      - name: Load CI image
        run: docker load --input /tmp/app-ci.tar

      - name: Run Unit Tests
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            -e APP_ENV=testing \
            app:ci \
            vendor/bin/phpunit --testsuite=Unit --testdox

  # ============================================
  # FEATURE TESTS (with services)
  # ============================================
  test-feature:
    name: Feature Tests
    runs-on: ubuntu-latest
    needs: build-ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI image
        uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp

      - name: Load CI image
        run: docker load --input /tmp/app-ci.tar

      - name: Prepare environment
        run: |
          cp .env.example .env
          docker run --rm \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            app:ci \
            php artisan key:generate

      - name: Run Feature Tests
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=testing \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=secret \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            app:ci \
            vendor/bin/phpunit --testsuite=Feature --testdox

  # ============================================
  # STATIC ANALYSIS
  # ============================================
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest
    needs: build-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI image
        uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp

      - name: Load CI image
        run: docker load --input /tmp/app-ci.tar

      - name: Run PHPStan
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            app:ci \
            vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  # ============================================
  # CODE STYLE
  # ============================================
  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    needs: build-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI image
        uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp

      - name: Load CI image
        run: docker load --input /tmp/app-ci.tar

      - name: Run Laravel Pint
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            app:ci \
            vendor/bin/pint --test

  # ============================================
  # BUILD PRODUCTION IMAGE
  # ============================================
  build-production:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [test-unit, test-feature, phpstan, code-style]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-php
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,mode=max,scope=prod-image

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Production Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}-php:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
