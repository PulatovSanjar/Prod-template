name: CI/CD (PROD)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: magma-bank-service
  TAG: ${{ github.sha }}

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build php-fpm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm:${{ env.TAG }}

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-web:${{ env.TAG }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker compose -f compose.dev.yaml up -d mysql redis
      - run: cp .env.example .env

      - run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            composer install --no-interaction --prefer-dist

      - run: |
          docker run --rm -v "$PWD":/var/www \
            ghcr.io/${{ needs.build.outputs.owner }}/${{ env.IMAGE_PREFIX }}-workspace:${{ env.TAG }} \
            ./vendor/bin/phpunit

  migrate:
    name: Migrate (PROD)
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Run migrations
        run: |
          ssh -i "${{ secrets.PROD_SSH_KEY }}" \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "
              cd ${{ secrets.PROD_DEPLOY_PATH }} &&
              echo TAG=${{ env.TAG }} > .env.deploy &&
              docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} &&
              docker compose --env-file .env.deploy -f compose.prod.yaml pull &&
              docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force
            "

  deploy:
    name: Deploy (PROD)
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - name: Deploy
        run: |
          ssh -i "${{ secrets.PROD_SSH_KEY }}" \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "
              cd ${{ secrets.PROD_DEPLOY_PATH }} &&
              docker compose --env-file .env.deploy -f compose.prod.yaml up -d --remove-orphans
            "
