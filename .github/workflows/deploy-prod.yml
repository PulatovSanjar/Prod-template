name: CI/CD (PROD)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: prod-templ
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build php-fpm (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-php-fpm:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_PREFIX }}-nginx:${{ env.TAG }}

  # =========================
  # 2️⃣ TEST
  # =========================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: ci
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start DB
        run: docker compose -f compose.ci.yaml up -d mysql redis

      - name: PHPUnit
        run: docker compose -f compose.ci.yaml run --rm php-fpm ./vendor/bin/phpunit

      - name: PHPStan
        run: docker compose -f compose.ci.yaml run --rm php-fpm ./vendor/bin/phpstan analyse --memory-limit=-1

  migrate:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Run migrations
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }} &&
            echo TAG=${{ env.TAG }} > .env.deploy &&
            docker login ghcr.io -u ${{ github.actor }} -p '${{ secrets.GITHUB_TOKEN }}' &&
            docker compose --env-file .env.deploy -f compose.prod.yaml pull &&
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d php-fpm &&
            docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force
          "

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }} &&
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d --remove-orphans
          "
