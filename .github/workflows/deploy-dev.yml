name: Deploy to DEV

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web
  IMAGE_PHP: ghcr.io/${{ github.repository }}-php-fpm
  TAG: ${{ github.sha }}
  LATEST_TAG: dev-latest
  STACK_NAME: dev_stack

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push PHP-FPM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PHP }}:${{ github.sha }}
            ${{ env.IMAGE_PHP }}:prod-latest

      - name: Build & Push php-fpm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PHP }}:${{ env.TAG }}
            ${{ env.IMAGE_PHP }}:${{ env.LATEST_TAG }}

      - name: Build & Push web (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ env.TAG }}
            ${{ env.IMAGE_WEB }}:${{ env.LATEST_TAG }}

  php-unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run phpunit
        run: |
          docker run --rm -v "$PWD":/var/www -w /var/www \
          ${{ env.IMAGE_PHP }}:${{ env.TAG }} ./vendor/bin/phpunit

  php-stan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run phpstan
        run: |
          docker run --rm -v "$PWD":/var/www -w /var/www \
          ${{ env.IMAGE_PHP }}:${{ env.TAG }} ./vendor/bin/phpstan analyse --memory-limit=-1 --configuration='phpstan.neon.dist'

  php-cs-fixer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run php-cs-fixer
        run: |
          docker run --rm -v "$PWD":/var/www -w /var/www \
          ${{ env.IMAGE_PHP }}:${{ env.TAG }} ./vendor/bin/php-cs-fixer fix -vvv --dry-run --allow-risky=yes

  migrate:
    runs-on: ubuntu-latest
    needs: [php-unit, php-stan, php-cs-fixer]
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations
        run: |
          ssh -i ${{ secrets.DEV_SSH_KEY }} ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} "\
            cd ${{ secrets.DEPLOY_PATH }} && \
            echo TAG=${{ env.TAG }} > .env.deploy && \
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
            docker compose --env-file .env.deploy -f compose.prod.yaml pull php-fpm web queue scheduler && \
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d --scale php-fpm=2 --scale web=2 && \
            docker compose --env-file .env.deploy -f compose.prod.yaml exec -T php-fpm php artisan migrate --force"

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - name: Zero-downtime deploy
        run: |
          ssh -i ${{ secrets.DEV_SSH_KEY }} ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} "\
            cd ${{ secrets.DEPLOY_PATH }} && \
            docker compose --env-file .env.deploy -f compose.prod.yaml up -d --scale php-fpm=2 --scale web=2 && \
            docker compose --env-file .env.deploy -f compose.prod.yaml ps && \
            docker compose --env-file .env.deploy -f compose.prod.yaml down --remove-orphans --timeout 30"
