# CI-specific compose file
# Uses pre-built app:ci image instead of building from scratch
# No volume mounts - uses files baked into the image

services:
  php-fpm:
    image: app:ci
    container_name: php-ci
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=testing
      - APP_KEY=base64:aDy+VeZ2l0/trWAskNU901hForiBrUGJhNl6sXxI+3U=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=testing
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=array
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=sync
    networks:
      - ci_network

  mysql:
    image: mysql:8.4
    container_name: mysql-ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: testing
    tmpfs:
      - /var/lib/mysql
    networks:
      - ci_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-ci
    networks:
      - ci_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  ci_network:
    driver: bridge
